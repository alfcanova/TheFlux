keyword: complex32, complex64, complex128
category: Tipo Numérico - Complexo
description: Tipos numéricos complexos com partes real e imaginária (complex32, complex64, complex128).
syntax: 'mut as complex32: <identificador> [, <identificador> ...]  = <real> + <imag>i   # 2 x float16

  mut as complex64: <identificador> [, <identificador> ...]  = <real> + <imag>i   # 2 x float32

  mut as complex128: <identificador> [, <identificador> ...] = <real> + <imag>i   # 2 x float64'
pseudocode: 'num : COMPLEXO128 = 1 + 2i   // parte real + parte imaginaria'
usages:
- name: Declaração de tipos complexos
  description: Declara variáveis com tipos numéricos complexos compostos por parte real e imaginária.
  examples:
  - code: 'mut as complex32: c32 = -1.5 + -2.5i

      mut as complex64: c64 = 64.125 + -8.5i

      mut as complex128: c128 = 1.5 + 2.5i'
restrictions:
- 'O sufixo i (ou j) indica a parte imaginária (ex: 2.5i).'
- complex32 usa 2 componentes float16; complex64 usa 2 float32; complex128 usa 2 float64.
- bigcomplex é reservado para versões futuras.
- 'Ver também KW_LITERAL_complex.yaml (literal) — tipos e literais são arquivos espelhados: TYPES descreve a forma na declaração,
  LITERAL descreve a sintaxe do valor.'
