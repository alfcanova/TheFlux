keyword: break
category: Loop Control
description: Interrormpe imediatamente o loop `infinite` mais interno, transferindo o controle para a instrução seguinte ao
  block do loop.
syntax: break
pseudocode: "REPETIR FOR SEMPRE:\n    corpo...\n    IF pronto: INTERROMPER   // break sai do loop mais interno"
usages:
- name: Break simples
  description: Sai do loop infinito imediatamente.
  examples:
  - code: "infinite {\n      print(\"rodei\")\n      break\n}"
- name: Break após condition
  description: Break condicional dentro do loop.
  examples:
  - code: "mut as int64: i = 0\ninfinite {\n      i = i + 1\n      route {\n            i == 3 ==> { break }\n           \
      \ _ ==> { print(i) }\n      }\n}"
restrictions:
- Só can be used dentro de um block `infinite`.
- Break encerra apenas o loop mais interno.
