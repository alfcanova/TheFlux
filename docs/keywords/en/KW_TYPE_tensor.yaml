keyword: tensor
category: Tensor Type
description: 'Multidimensional type (vector, matrix, N-D tensor) with static shape, stored in a flat buffer and indexed by strides (with linear offset and strides). Supports zero-copy O(1) transposition, permutation, slicing (sub-views), and zero-stride broadcasting through the strided memory model. Declared with static dimensions and element type (e.g., tensor[2, 2] of int32) or operated dynamically via LinAlgStdLib.'
syntax: 'mut as tensor[<dim1>, <dim2>, ...] of <element_type>: <var1>, ... [= <values>]'
pseudocode: 'm : TENSOR[2, 3] OF int32   // static shape, strided memory mapping'
usages:
- name: One-dimensional vector
  description: Vector with explicit element type.
  examples:
  - code: 'mut as tensor[3] of float32: t1 = [1.5, 2.5, 3.5]'
- name: Two-dimensional matrix
  description: Matrix with 1-based multi-index access.
  examples:
  - code: "mut as tensor[2, 2] of int32: t2 = [\n    [10, 20],\n    [30, 40]\n]\nprint(t2[2, 2])   # 40"
- name: Multi-index assignment (Index-assign)
  description: Element modification via N-D coordinates.
  examples:
  - code: "mut as tensor[2, 2] of int64: t = [[10, 20], [30, 40]]\nt[2, 1] = 99\nprint(t)   # [[10, 20], [99, 40]]"
- name: Strides operations and manipulation (LinAlgStdLib)
  description: O(1) zero-copy transposition, slicing, zero-stride broadcasting, and rolling windows via standard library.
  examples:
  - code: "use LinAlgStdLib\n# Column-Major / Fortran matrix with custom strides [1, 2]\nmut as map: mat_f = tensorNewWithStrides([2, 2], [1, 2], 1, [10.0, 20.0, 30.0, 40.0])\n# O(1) rolling window view over 1D buffer (im2col / patches)\nmut as map: win = tensorAsStrided(mat_f, [2, 2], [1, 1], 1)\n# Zero-copy virtual broadcast with stride 0\nmut as map: bcast = tensorBroadcastTo(row_vec, [4, 3])"
restrictions:
- Type name must be lowercase (tensor, not Tensor); no capitalized form.
- Shape must be fully static (e.g. [3, 4]); positive integer dimensions.
- Element type must be an implemented numerical type.
- Indices are 1-based in source code; backend automatically converts to 0-based offset (`linear_index = offset + sum((i_k - 1) * stride_k)`).
- Native runtime layout is a flat buffer with canonical row-major strides (`S_last=8`, `S_k = d_{k+1} * S_{k+1}` bytes); each element occupies 8 bytes (float bitcast, string as FAT `(ptr<<32)|len`).
- Block header stores `[rank, d0..d{rank-1}]` for generic printing and debugging.
- Literal initializer must be rectangular and match declared shape (ragged/mismatch is a semantic and runtime error).
- Element reads preserve declared element type (does not force float64).
- Write operations validate bounds across all traversed dimensions.
- Print and string concatenation use nested format `[[10, 20], [99, 40]]`.
