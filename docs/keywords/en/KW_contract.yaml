keyword: contract
category: Contract Declaration
description: 'Declara um contract que define um conjunto de assinaturas de operations (op) que um agent (agent) pode implementar.
  O contract é uma interface que especifica nomes, parameters e types de return sem implementação.

  Contracts são válidos apenas em files .fdsl. The contract name must be in PascalCase. '
syntax: "contract (<Nome_PascalCase>) {\n      op <nome_camelCase> ([mut | imut | as] <type>: <identifier> [, ...]) [as <tipo_retorno>]\n\
  \      op <nome_camelCase> () [as <tipo_retorno>]\n      ...\n}\n"
pseudocode: "CONTRATO Operavel:\n    assinatura ligar()\n    assinatura desligar()\n// conjunto de assinaturas que um agent\
  \ pode implementar"
usages:
- name: Contract com operations simples
  description: Contract com ops sem parameters.
  examples:
  - code: "contract (Readable) {\n      op read () as int64\n}\n"
- name: Contract com operations parametrizadas
  description: Contract para operations matemáticas básicas com parameters nomeados.
  examples:
  - code: "contract (OperacoesBasicas) {\n      op somar (as int64: a, as int64: b) as int64\n      op subtrair (as int64:\
      \ a, as int64: b) as int64\n      op multiplicar (as int64: a, as int64: b) as int64\n      op dividirInteiro (as int64:\
      \ a, as int64: b) as int64\n}\n"
- name: Múltiplos contracts no mesmo file
  description: Dois contracts declarados sequencialmente em um .fdsl.
  examples:
  - code: "contract (ReadOp) {\n      op read () as int64\n}\ncontract (WriteOp) {\n      op write () as int64\n}\n"
restrictions:
- The contract name must be in PascalCase.
- Operations em contracts não podem ter body (apenas assinatura).
- Deve haver pelo menos uma operation no contract.
- Contracts são válidos apenas em files .fdsl (não em .flux).
- Agents implementam contracts via a cláusula `impl` in the declaration `agent`.
