keyword: literal inteiro (integer_literal)
category: Numeric Literal
description: Integer numeric literals in decimal base. They are formed by sequences of digits 0 through 9. O sinal negativo
  é um operator unário de prefixo, não fazendo parte do literal. O type pattern inferido é int64, a menos que a declaration
  especifique outro type integer.
syntax: '<dígitos>         # Ex: 42

  0                 # Zero

  <dígito_1-9>{dígitos}  # Números sem zeros à esquerda'
pseudocode: n := 42   // integer decimal, com sinal
usages:
- name: Literais integers básicos
  description: Integers decimais nas declarations.
  examples:
  - code: 'mut as int8: valor= -8

      mut as int16: contador= -1600

      mut as int32: indice= 32000

      mut as int64: total= 64000'
- name: Integers sem sinal
  description: Non-negative integer values.
  examples:
  - code: 'mut as uint8: byte= 255

      mut as uint64: endereco= 999999999'
- name: Type inference
  description: Without explicit type, literal is int64.
  examples:
  - code: 'mut as int64: x = 42        # literal decimal, tipo int64

      mut as int64: zero = 0      # zero, tipo int64'
restrictions:
- 'There is no type suffix no literal (ex: 42i32) — o type é determinado pela declaration.'
- 'Zero à esquerda is not allowed em literais integers (ex: 007 é inválido).'
- 'Sinal negativo: semanticamente é operator unário prefixo; no lexer, o sinal é inbodyrado ao lexema do literal (ex: -42
  é um token INT_LIT "-42").'
- Apenas a base decimal é suportada nesta versão (sem suporte a hex, bin ou oct em v0.1).
- 'Ver também KW_TYPE_int.yaml (type) — types e literais são files espelhados: TYPES descreve a forma in the declaration,
  LITERAL descreve a sintaxe do value.'
