keyword: meta
category: Metaprogramção
description: Declara uma meta-function de metaprogramção (`meta`) que gera e transforma código at compile time. O body de
  uma definição `meta` returns uma árvore sintática encapsulada em um block `lift { ... }`. Parameters passados para a meta-function
  são injetados no código gerado através da expression `lower(param)`. A expansão de metas é realizada estaticamente pelo
  compilador antes da análise semântica e da geração de código.
syntax: "meta (<nomeCamelCase>) (<params>) {\n      lift {\n            <declarações_ou_expressões com lower(param)>\n   \
  \   }\n}"
pseudocode: "METAFUNCAO gerar_campos(lista):\n    // produces codigo-fonte em tempo de compilacao\n    RETURN codigo_gerado"
usages:
- name: Meta com um parameter
  description: Meta-function que dobra um value at compile time.
  examples:
  - code: "meta dobraNumero(num) {\n      lift {\n            mut as int64: res = lower(num) * 2\n      }\n}\n\nprogram (ExemploDobra)\
      \ {\n      mut as int64: dobrado = dobraNumero(21)\n      print(dobrado)\n}"
- name: Meta com 3 parameters (Área do Trapézio)
  description: Meta-function que calcula a área decimal de um trapézio ((bmaior + bmenor) * altura) /f 2 a partir de 3 parameters
    enviados.
  examples:
  - code: "meta areaTrapezio(bmaior, bmenor, altura) {\n      lift {\n            mut as float64: area = ((lower(bmaior) +\
      \ lower(bmenor)) * lower(altura)) /f 2\n      }\n}\n\nprogram (ExemploTrapezio) {\n      mut as float64: a = areaTrapezio(15,\
      \ 6, 3)\n      print(a)\n}"
restrictions:
- meta é válida apenas no nível superior do module ou file.
- O body de uma meta deve conter uma expression ou block lift { ... }.
- lower() só can be utilizado dentro de blocks lift.
- 'Profundidade máxima de expansão estática recursiva: 64 níveis.'
- Suportado de forma transparente em todos os 5 backends (Interpreter, VM, LLVM, WAT, WASM).
