keyword: int8, int16, int32, int64, uint8, uint16, uint32, uint64
category: Tipo Numérico - Inteiro
description: Tipos inteiros de largura fixa com sinal e sem sinal (int8, int16, int32, int64, uint8, uint16, uint32, uint64).
syntax: 'mut as <tipo>: <var> = <valor>     # tipo obrigatório na declaração

  mut as int8: <var> = <valor>      # -128 a 127

  mut as int16: <var> = <valor>     # -32768 a 32767

  mut as int32: <var> = <valor>     # -2147483648 a 2147483647

  mut as int64: <var> = <valor>     # -9223372036854775808 a 9223372036854775807

  mut as uint8: <var> = <valor>     # 0 a 255

  mut as uint16: <var> = <valor>    # 0 a 65535

  mut as uint32: <var> = <valor>    # 0 a 4294967295

  mut as uint64: <var> = <valor>    # 0 a 18446744073709551615'
pseudocode: 'i : INTEIRO64 = 42   // int8..uint64, com/sem sinal'
usages:
- name: Inteiros com sinal
  description: Declaração de todos os tipos inteiros com sinal.
  examples:
  - code: 'mut as int8: byte = -8

      mut as int16: small = -1600

      mut as int32: medium = -32000

      mut as int64: large = -64000'
- name: Inteiros sem sinal
  description: Declaração de todos os tipos inteiros sem sinal.
  examples:
  - code: 'mut as uint8: u_byte = 8

      mut as uint16: u_small = 1600

      mut as uint32: u_medium = 32000

      mut as uint64: u_large = 64000'
restrictions:
- Valores fora da faixa suportada pelo tipo são rejeitados em tempo de compilação (SEM001).
- Os tipos genéricos int e uint foram removidos; a especificação exata da largura é obrigatória.
- Não há literais com sufixo de tipo; o tipo vem da declaração explícita.
- A divisão inteira utiliza /i e o resto utiliza /r (/f é reservado para divisão decimal).
- 'Ver também KW_LITERAL_integer.yaml (literal) — tipos e literais são arquivos espelhados: TYPES descreve a forma na declaração,
  LITERAL descreve a sintaxe do valor.'
