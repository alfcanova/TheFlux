keyword: and, or, not
category: Operador Lógico
description: Operadores lógicos para composição de expressões booleanas. and e or são operadores infixos binários; not é um
  operador prefixo unário. A forma ! também é aceita como operador not prefixo.
syntax: '<expr> and <expr>   # Conjunção (E lógico) - precedência 30

  <expr> or  <expr>   # Disjunção (OU lógico) - precedência 20

  not <expr>          # Negação (NÃO lógico) - precedência 80

  ! <expr>            # Negação alternativa'
pseudocode: "SE (a E b) OU c:\n    ...\nSE NAO d:\n    ..."
usages:
- name: Composição de condições
  description: Combina múltiplas condições com and/or.
  examples:
  - code: "route {\n    nota >= 9.0 and frequencia >= 95.0 --> { print(\"Excelente!\") }\n    nota >= 7.0 and frequencia >=\
      \ 75.0 --> { print(\"Aprovado\") }\n    nota >= 5.0 or  frequencia >= 75.0 --> { print(\"Recuperacao\") }\n}"
- name: Negação
  description: Inverte o valor de uma expressão booleana.
  examples:
  - code: "route {\n    not (nota >= 5.0 or frequencia >= 75.0) --> { print(\"Reprovado\") }\n}"
- name: Route com sujeitos e operadores lógicos
  description: Combina condições posicionais com and/or em route with subjects.
  examples:
  - code: "route (temperatura, pressao) {\n    > 40 and \"alta\"   --> { print(\"PERIGO!\") }\n    > 37.5 and ..     --> {\
      \ print(\"Atencao: Febre\") }\n    _                 --> { print(\"Normal\") }\n}"
restrictions:
- and tem precedência maior que or (and = 30, or = 20).
- Operandos must be expressões booleanas.
- Avaliação é de curto-circuito (short-circuit evaluation).
