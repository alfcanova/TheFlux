keyword: or
category: Operador Lógico
description: Operador de disjunção lógica com avaliação de curto-circuito. Retorna true se qualquer um dos operandos avaliar
  para true.
syntax: <expr1> or <expr2>
pseudocode: "SE a OU b:\n    ...\n// disjuncao logica, curto-circuito"
usages:
- name: Disjunção lógica
  description: Avalia condições de fallback.
  examples:
  - code: 'mut as bool: ehValido = (count > 0) or ehPadrao'
restrictions:
- Ambos os operandos devem avaliar para expressões booleanas.