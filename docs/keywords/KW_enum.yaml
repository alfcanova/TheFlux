keyword: enum
category: Declaração de Tipo
description: Declara um tipo enum (união discriminada) inspirado em Rust. Um enum representa um conjunto fechado de variantes,
  onde cada variante pode ser unitária (sem payload) ou conter campos nomeados (payload). Variantes com payload utilizam a
  mesma sintaxe de campos nomeados das structs (ponto obrigatório, campos em linhas separadas), permitindo construção e desestruturação
  simétricas através do pattern matching. O discriminante (identificador numérico interno da variante) é sempre gerado automaticamente
  pelo compilador, na ordem de declaração, e não pode ser controlado pelo programador.
syntax: "enum (<NomePascalCase>) {\n\n    <VariantePascalCase>\n\n    <VariantePascalCase>(\n\n        .<campo_snake_case>:\
  \ <tipo>\n\n        ...\n\n    )\n\n    ...\n\n}"
pseudocode: "TIPO CORES:\n    VERMELHO\n    VERDE\n    AZUL (intensidade)\n// uniao discriminada: conjunto fechado de variantes"
usages:
- name: Enum com variantes unitárias
  description: Declara variantes sem payload.
  examples:
  - code: "enum (Estado) {\n\n    Aberto\n    Fechado\n    Suspenso\n\n}"
- name: Enum com payload
  description: Declara variantes contendo campos nomeados, um por linha.
  examples:
  - code: "enum (Resultado) {\n\n    Ok(\n\n        .valor: int64\n\n    )\n\n    Erro(\n\n        .mensagem: string\n\n \
      \   )\n\n}"
- name: Inicialização de variantes
  description: Constrói variantes utilizando campos nomeados prefixados por ponto. Todos os campos declarados devem ser fornecidos.
  examples:
  - code: "enum (Estado) {\n      Aberto\n}\nprogram (T) {\n      mut as Estado: estado = Estado::Aberto\n      print(estado)\n\
      }"
  - code: "enum (Resultado) {\n      Ok(\n            .valor: int64\n      )\n      Erro(\n            .mensagem: string\n\
      \      )\n}\nprogram (T) {\n      mut as Resultado: resposta = Resultado::Ok(\n            .valor: 42\n      )\n   \
      \   print(resposta)\n}"
  - code: "enum (Mensagem) {\n      Texto(\n            .conteudo: string\n      )\n}\nprogram (T) {\n      mut as Mensagem:\
      \ msg = Mensagem::Texto(\n            .conteudo: \"Ola Mundo\"\n      )\n      print(msg)\n}"
- name: Pattern matching
  description: Variantes são desestruturadas utilizando exatamente a mesma sintaxe empregada durante sua construção. O padrão
    pode selecionar um subconjunto dos campos (os demais são ignorados), com bind de nome, literal ou wildcard (_).
  examples:
  - code: "enum (Resultado) {\n      Ok(\n            .valor: int64\n      )\n      Erro(\n            .mensagem: string\n\
      \      )\n}\nprogram (T) {\n      mut as Resultado: resposta = Resultado::Ok(.valor: 1)\n      match resposta {\n  \
      \          Resultado::Ok(.valor: valor) ==> print(valor)\n            Resultado::Erro(.mensagem: mensagem) ==> print(mensagem)\n\
      \            _ ==> print(\"desconhecido\")\n      }\n}"
restrictions:
- O nome do enum deve estar em PascalCase.
- O keyword enum é escrito em minúsculo.
- Os nomes das variantes devem estar em PascalCase.
- Os nomes dos campos devem utilizar snake_case.
- Todo campo é obrigatoriamente prefixado por ponto (.), tanto na declaração quanto na construção e desestruturação.
- Cada campo ocupa uma linha própria; campos são separados por quebra de linha (EOL), nunca por vírgula.
- O enum deve possuir pelo menos uma variante.
- Os nomes das variantes devem ser únicos.
- Os nomes dos campos devem ser únicos dentro de cada variante.
- Variantes unitárias não utilizam parênteses.
- Variantes são acessadas utilizando o operador ::.
- Variantes com payload são inicializadas utilizando campos nomeados prefixados por ponto.
- A ordem dos campos durante a inicialização é irrelevante.
- Todos os campos declarados devem ser fornecidos na construção.
- Padrões de match podem selecionar um subconjunto dos campos; campos não mencionados são ignorados.
- A construção e a desestruturação utilizam exatamente a mesma estrutura sintática.
