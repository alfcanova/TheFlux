title: TheFlux Language Keywords and Operators Index
language: en
total_categories: 54
total_keywords: 74
description: Structured index of all keywords, operators, and special tokens of the TheFlux language, grouped by functional
  category.
categories:
- name: Entry Point
  keywords:
  - name: program
    file: KW_program.yaml
    description: Declara o dot de entrada required de um file .flux.  O  program must be a última declaration no file e é
      o block principal executesdo. O nome do program deve estar em PascalCase. Essa keyword é proibida  em files .fdsl.
    syntax_summary: program (<nome_PascalCase>) {
- name: Variable Declaration
  keywords:
  - name: mut
    file: KW_mut.yaml
    description: 'Declara uma variable mutable, com value inicial explícito optional. Sem value inicial, a variable receives
      o value pattern do type (0, 0.0, false, string vazia etc.). Múltiplas variables can be declaradas com commas na forma
      principal (`mut as <type>: a, b = 42`).'
    syntax_summary: 'mut as <tipo>: <identificador> [, <identificador> ...] [= <expressão>]'
- name: Immutable Variable Declaration
  keywords:
  - name: imut
    file: KW_imut.yaml
    description: Declara uma constante immutable com value inicial required. Uma vez atribuída, cannot be reatribuída; a reassignment
      generates errorr semântico (SEM001). Múltiplas constantes can be declaradas na forma principal com commas, desde que
      compartilhem o mesmo value inicial.
    syntax_summary: 'imut as <tipo>: <identificador> [, <identificador> ...] = <expressão>'
- name: Type Declaration
  keywords:
  - name: enum
    file: KW_enum.yaml
    description: Declara um type enum (união discriminada) inspirado em Rust. Um enum representa um conjunto fechado de variants,
      onde cada variant can be unitária (sem payload) ou conter fields nomeados (payload). Variantes com payload utilizam
      a mesma sintaxe de fields nomeados das structs (dot required, fields em linhas separadas), permitindo construção e desestruturação
      simétricas através do pattern matching. O discriminante (identifier numérico interno da variant) é sempre gerado automaticamente
      pelo compilador, na ordem de declaration, e cannot be controlado pelo programdor.
    syntax_summary: enum (<NomePascalCase>) {
  - name: struct
    file: KW_struct.yaml
    description: Declara um type struct (registro) composto por um conjunto fixo de fields nomeados. Cada field can be mutable
      (mut) ou immutable (imut). Uma struct representa um único formato de dados e possui exatamente um construtor nominal.
      A mesma sintaxe utilizada para construir uma struct é reutilizada pelo pattern matching para desestruturá-la, tornando
      construção e desconstrução operations simétricas. O nome da struct deve estar em PascalCase.
    syntax_summary: struct (<NomePascalCase>) {
- name: Function Declaration
  keywords:
  - name: function
    file: KW_function.yaml
    description: 'Declara uma function nomeada e reutilizável com parameters tipados e return optional (via `as <type_return>`).
      Parâmetros são immutable (`imut`) por pattern quando o modificador de mutabilidade for omitido (ex: `as <type>: <identifier>`);
      para permitir reassignment ao parameter no scope local, declare-o explicitamente como `mut as <type>: <identifier>`.
      Parâmetros do mesmo type e mutabilidade can be agrupados em uma única declaration (`[mut | imut | as] <type>: <id1>,
      <id2>, ..., <idN>`); grupos com tipagens distintas são separados por `;`. O body da function deve terminar com um `emit`
      terminal que devolve um struct implícito de resultado de três fields (`.sta`, `.val`, `.msg`). Se o field de return
      não for explicitado no chamador, o field pattern de evaluatesção é o `.val`. Functions são declaradas no topo do file
      (.flux) ou no body de agents/impl (.fdsl), antes do `program`, e can be chamadas por `nome(args)`; o resultado integer
      fica disponível via variable (`r = calc(5)`) e cada field é lido com acesso nomeado.'
    syntax_summary: 'function (<nome_camelCase>) ([mut | imut | as] <tipo>: <identificador1>, ..., <identificadorN> [; [mut
      | imut | as] <tipo>: <identificador1>, ..., <identificadorN>]) [as <tipo_retorno>] {'
- name: Operation Declaration
  keywords:
  - name: op
    file: KW_op.yaml
    description: 'Declara uma operation dentro de um agent (agent) em files .fdsl ou uma assinatura de operation dentro de
      um contract (contract). Operations são functions encapsuladas no agent com return optional (via `as <type_return>`).
      Parameters são immutable (`imut`) por pattern quando o modificador de mutabilidade for omitido (ex: `as <type>: <identifier>`);
      para permitir reassignment ao parameter no scope local, declare-o explicitamente como `mut as <type>: <identifier>`.
      O body da operation deve terminar com um `emit` terminal que devolve um struct implícito de resultado (.sta, .val, .msg).
      O nome da operation deve estar em camelCase.'
    syntax_summary: '# Op com corpo — dentro de agent; parâmetros no formato ([mut | imut | as] <tipo>: <identificador>, ...);'
- name: Agent Declaration
  keywords:
  - name: agent
    file: KW_agent.yaml
    description: Declara um agent em files .fdsl. Agents são unidades modulares que encapsulam operations (op). O nome do
      agent deve estar em PascalCase. Agents são proibidos em files .flux.
    syntax_summary: agent (<nome_PascalCase>) {
- name: Contract Declaration
  keywords:
  - name: contract
    file: KW_contract.yaml
    description: 'Declara um contract que define um conjunto de assinaturas de operations (op) que um agent (agent) pode implementar.
      O contract é uma interface que especifica nomes, parameters e types de return sem implementação.

      Contracts são válidos apenas em files .fdsl. The contract name must be in PascalCase. '
    syntax_summary: contract (<Nome_PascalCase>) {
- name: Contract Implementation
  keywords:
  - name: impl
    file: KW_impl.yaml
    description: 'Cláusula usada in the declaration de um agent (agent) para indicar que ele implementa um ou mais contracts
      (contract). O agent deve fornecer uma operation (op) para cada assinatura definida nos contracts, com aridade, parameters
      e type de return correspondentes.

      Suporta múltiplos contracts separados por comma. Válido apenas em files .fdsl. '
    syntax_summary: agent (<Nome_PascalCase>) impl <Contrato1>, <Contrato2>, ... {
- name: Import Declaration
  keywords:
  - name: use
    file: KW_use.yaml
    description: Importa agents ou operations de agents de outros modules. Pode importar um agent integer with alias, uma
      operation específica with alias, ou um grupo de operations de um agent.
    syntax_summary: use <AgentePascalCase> as <AliasPascalCase>
- name: Type Composition
  keywords:
  - name: of
    file: KW_of.yaml
    description: Operator de composição de type para coleções e tensores (`list of <type>`, `set of <type>`, `tensor[...]
      of <type>`). Especifica o type dos elementos contidos na estrutura.
    syntax_summary: list of <tipo_elemento>
- name: Loop Structure
  keywords:
  - name: infinite
    file: KW_infinite.yaml
    description: Cria um loop de repetição infinito. O loop executes o body repetidamente até que uma instrução `break` interrormpa
      a execução. Opcionalmente pode receivesr uma condition booleana que, quando falsa, encerra o loop.
    syntax_summary: infinite {
- name: Loop Control
  keywords:
  - name: break
    file: KW_break.yaml
    description: Interrormpe imediatamente o loop `infinite` mais interno, transferindo o controle para a instrução seguinte
      ao block do loop.
    syntax_summary: break
  - name: continue
    file: KW_continue.yaml
    description: Pula o restante da iteration atual do loop `infinite` mais interno e continua na próxima iteration (reevaluatesndo
      a condition, se houver).
    syntax_summary: continue
- name: Conditional Flow Control
  keywords:
  - name: route
    file: KW_route.yaml
    description: Evaluates conditions em ordem e executes o block correspondente ao primeiro branch cuja condition seja verdadeira.
      O branch wildcard (`_`) captura qualquer value não coberto pelos branches anteriores. Pode substituir strings de if/else
      if/else.
    syntax_summary: route {
- name: Pattern Matching
  keywords:
  - name: match
    file: KW_match.yaml
    description: Realiza casamento de patterns (pattern matching) sobre uma expression. O match é uma expression e returns
      o value producesido pelo primeiro branch cujo pattern corresponda ao value analisado e cuja guard (guard), quando presente,
      seja verdadeira. A sintaxe de desestruturação reutiliza exatamente a mesma forma utilizada na construção de structs
      e variants de enum, tornando construção e desconstrução operations simétricas. Para enums, o compilador verifica exaustividade
      e detecta branches inalcançáveis.
    syntax_summary: match (<expressao>) {
  - name: _
    file: KW_underscore.yaml
    description: O character underscore (`_`) atua como curinga (wildcard) universal e pattern de descarte na linguagem TheFlux.
      É utilizado como branch catch-all em estruturas `route`, como pattern universal em expressions `match` (garantindo exaustividade
      em enums e types literais), e como descarte de fields na desestruturação de structs, registros e variants de enums.
    syntax_summary: route {
- name: Stateful Conditional Handling
  keywords:
  - name: '?'
    file: KW_short_circuit.yaml
    description: 'Block short-circuit que evaluates uma expression. O return dessa expression é um struct transparente gerado
      e enviado internamente pelo comando `emit`. O operator `?` intercepta esse struct e despacha o fluxo para um dos dois
      branches requireds: executes o primeiro branch quando o struct transparente possui `.sta == "fail"`, e o segundo branch
      quando `.sta == "nice"`. O struct returnsdo é ligado diretamente  na variable resultante (permitindo ler `.sta`, `.val`
      e `.msg`) sem reevaluatesr a chamada.'
    syntax_summary: <expressão> ?
- name: Iteration
  keywords:
  - name: in
    file: KW_in.yaml
    description: 'O operator `in` é usado em loops `infinite (variable in coleção)` para iterar sobre os elementos de uma
      coleção: range numérico, lista, set ou string. O argument da esquerda declara a variable iteradora (snake_case); o da
      direita é a coleção percorrida. Ao iterar sobre map/data, a iteration percorre as braces.'
    syntax_summary: infinite (<variável_snake_case> in <coleção>) { <corpo> }
- name: Guaranteed Execution
  keywords:
  - name: ensure
    file: KW_ensure.yaml
    description: Operator de cleanup que garante que um block de código sempre execute, independentemente de success ou failure
      da expression alvo. Preserva o value original ou re-lança a failure após a execução do block.
    syntax_summary: '''<expressão> ensure { <bloco_cleanup> }'
- name: Return Instruction
  keywords:
  - name: emit
    file: KW_emit.yaml
    description: 'Encerra a function atual devolvendo um struct implícito de resultado com três fields sempre definidos: `.sta`
      ("nice" | "fail"), `.val` (value do identifier emitido, tipado pelo `as <type>` da function) e `.msg` (mensagem string
      ou interpolada). `emit` é o statement terminal required do body de uma function. O struct integer fica disponível via
      variable (`r = calc(5)`); depois leia cada field com acesso nomeado.'
    syntax_summary: emit(nice, <identificador>, "<mensagem>")
- name: Return Status
  keywords:
  - name: fail
    file: KW_fail.yaml
    description: Status de failure usado na instrução `emit(fail, ...)`. Indica que a function encontrou um error ou condition
      excepcional e devolve um struct de resultado com `.sta == "fail"`. O chamador captura o resultado pelos fields `.sta`,
      `.val` e `.msg`, ou despacha o fluxo com o operator `?`. O runtime também gera o status `fail` automaticamente quando
      ocorre divisão por zero (mensagem "divisao por zero").
    syntax_summary: emit(fail, <identificador>, "<mensagem>")
  - name: nice
    file: KW_nice.yaml
    description: Status de success usado na instrução `emit(nice, ...)`. Indica que a function completou sua execução com
      success e devolve um struct de resultado com `.sta == "nice"`. É a contraparte positiva de `fail`. O chamador captura
      o resultado pelos fields `.sta`, `.val` e `.msg`, ou despacha o fluxo com o operator `?`.
    syntax_summary: emit(nice, <identificador>, "<mensagem>")
- name: Output Instruction
  keywords:
  - name: print
    file: KW_print.yaml
    description: Imprime o value de uma expression na standard output. Can be usado como instrução (`print(...)`) ou como
      sink em um pipeline de dataflow (`--> print`), onde encerra a string.
    syntax_summary: print(<expressão>)
- name: Arithmetic Operator
  keywords:
  - name: +, -, *, /f, /i, /r, ^e, ^r
    file: KW_OP_arithmetic.yaml
    description: Operatores aritméticos da linguagem TheFlux. Diferencia divisão decimal (/f), divisão inteira (/i) e resto
      de divisão (/r), assim como exponenciação (^e) e radiciação (^r). Os operators seguem a precedência matemática pattern.
    syntax_summary: '<expr> + <expr>    # Adição'
- name: Arithmetic Assignment Operator
  keywords:
  - name: =, =+, =-, =*, =/f, =/i, =/r, =^e, =^r
    file: KW_OP_assignment_arithmetic.yaml
    description: Operators de assignment simples e composta aritmética. A assignment simples (=) suporta identifiers, acesso
      a fields, indexs e multi-indexs. Assignments compostas aritméticas (=+, =-, =*, =/f, =/i, =/r, =^e, =^r) combinam operation
      aritmética com assignment, e suportam apenas identifiers simples.
    syntax_summary: '<alvo> = <expr>              # Atribuição simples'
- name: Bitwise Assignment Operator
  keywords:
  - name: =&, =|, =^, =~, =<<, =>>, =>>>
    file: KW_OP_assignment_bitwise.yaml
    description: Operators de assignment composta bitwise. Combinam operation bitwise (AND, OR, XOR, NOT, shifts) com assignment,
      e suportam apenas identifiers simples.
    syntax_summary: '<alvo> =& <expr>             # Atribuição com AND bitwise'
- name: Bitwise Operator
  keywords:
  - name: '&, |, ^, ~, <<, >>, >>>'
    file: KW_OP_bitwise.yaml
    description: Operators de manipulação bitwise para integers. Incluem AND, OR, XOR, NOT bitwise, deslocamento à esquerda
      (<<), à direita com sinal (>>) e à direita com preenchimento zero (>>>).
    syntax_summary: '<expr> & <expr>     # AND bitwise'
- name: Comparison Operator
  keywords:
  - name: ==, !=, <, >, <=, >=
    file: KW_OP_comparison.yaml
    description: Operators relacionais que comparam dois values e return um booleano. Usados em conditions de route, expressions
      booleanas e qualquer contexto que exija evaluatesção de ordem ou igualdade.
    syntax_summary: '<expr> == <expr>   # Igual a'
- name: Logical Operator
  keywords:
  - name: and
    file: KW_and.yaml
    description: Operator de conjunção lógica com evaluatesção de curto-circuito. Returns true somente se ambos os operandos
      evaluatesrem para true.
    syntax_summary: <expr1> and <expr2>
  - name: not
    file: KW_not.yaml
    description: Operator unário de negação lógica. Inverte o value booleano de verdade de uma expression.
    syntax_summary: not <expressão>
  - name: and, or, not
    file: KW_OP_logical.yaml
    description: Operadores lógicos para composição de expressions booleanas. and e or são operators infixos binários; not
      é um operator prefixo unário. A forma ! também é aceita como operator not prefixo.
    syntax_summary: '<expr> and <expr>   # Conjunção (E lógico) - precedência 30'
  - name: or
    file: KW_or.yaml
    description: Operator de disjunção lógica com evaluatesção de curto-circuito. Returns true se qualquer um dos operandos
      evaluatesr para true.
    syntax_summary: <expr1> or <expr2>
- name: Dataflow Operator
  keywords:
  - name: --> (dataflow), ==> (lambda), split, join
    file: KW_OP_dataflow.yaml
    description: Operators de fluxo de dados para pipelines e transformações. --> (ARROW) direciona um value para um destino
      (function, sink, print, spy, cast). ==> (LAMBDA_ARROW) é o separador entre pattern e expression em match arms e também
      funciona como transformação lambda com binding it. split bifurca um fluxo em vias paralelas; join consolida fluxos em
      uma lista.
    syntax_summary: '<expr> --> <destino>              # Pipeline de dataflow'
- name: Range / Slice Operator
  keywords:
  - name: ..
    file: KW_OP_range_slice.yaml
    description: 'O operator .. (range) tem dois usages: cria intervals numéricos inclusivos para iteration em infinite (a
      .. b), e especifica slices (slices) em coleções e strings [start .. end] ou (start .. end). O range é inclusivo em ambas
      as extremidades. Veja também KW_slices.yaml para o guia completo de slices.'
    syntax_summary: '<início> .. <fim>                     # Range numérico para iteração'
  - name: slices
    file: KW_slices.yaml
    description: 'Slices extraem slices de coleções e strings usando o operator de range .. dentro de delimitadores. O delimitador
      depende do type: brackets [ ] para list, data e tensor; parentheses ( ) para string. O range é inclusivo em ambas as
      extremidades e os indexs são 1-based.'
    syntax_summary: 'lista[ .. ]              # Slice completo (cópia)'
- name: Cast Operator / Import Alias
  keywords:
  - name: as
    file: KW_as.yaml
    description: Converte (cast) um value de um type para outro. Can be usado como operator pós-fixo em expressions ou como
      sink em pipelines de dataflow ((as <type>)). Também define alias ao importar agents ou operations com use.
    syntax_summary: <expressão> as <tipo>
- name: Primitive Scalar Type
  keywords:
  - name: char, bool, datetime, string
    file: KW_TYPE_scalar.yaml
    description: 'Tipos escalares nativos que não são numéricos: char (code point Unicode UTF-32), bool (booleano), datetime
      (timestamp ISO 8601), string (string de texto). Esses types são reconhecidos pelo lexer como palavras reservadas de
      type.'
    syntax_summary: 'mut as char: <var> = ''<caractere>'''
- name: Character Type
  keywords:
  - name: char
    file: KW_TYPE_char.yaml
    description: 'Tipo character: representa exatamente um code point Unicode (U+0000..U+10FFFF). Internamente, em backends
      compilados (llvm/wat/wasm), o value é armazenado como code point de 32 bits (i32); a codificação UTF-8 (1-4 bytes) é
      producesida apenas na impressão, concatenação com string e operations de texto. No interpretador, o value é mantido
      como string Python de 1 code point. O type genérico is required in the declaration.'
    syntax_summary: 'mut as char: <var> = ''<code point>'''
- name: String Type
  keywords:
  - name: string, string(N)
    file: KW_TYPE_string.yaml
    description: 'Types de texto. string é dinâmica (alocação sob demanda); string(N) é estática com capacidade fixa de N
      bytes UTF-8. O type genérico is required in the declaration (mut as string: x = ...). Char tem doc próprio: KW_TYPE_char.yaml.'
    syntax_summary: 'mut as string: <var> = <valor>        # dinâmica (fat pointer)'
- name: Numeric Type - Integer
  keywords:
  - name: int8, int16, int32, int64, uint8, uint16, uint32, uint64
    file: KW_TYPE_int.yaml
    description: Types integers de width fixa com sinal e sem sinal (int8, int16, int32, int64, uint8, uint16, uint32, uint64).
    syntax_summary: 'mut as <tipo>: <var> = <valor>     # tipo obrigatório na declaração'
- name: Numeric Type - Floating Point
  keywords:
  - name: float16, float32, float64, fp8_e4m3, fp8_e5m2, bf16_e8m7, tf32_e8m10
    file: KW_TYPE_float.yaml
    description: Types de dot flutuante com precisão definida e formatos especiais para IA/ML (float16, float32, float64,
      fp8_e4m3, fp8_e5m2, bf16_e8m7, tf32_e8m10).
    syntax_summary: 'mut as <tipo>: <var> = <valor>   # tipo obrigatório na declaração'
- name: Numeric Type - Complex
  keywords:
  - name: literal complexo (complex_literal)
    file: KW_LITERAL_complex.yaml
    description: Literais complexos representam numbers complexos. O literal imaginário é formado por um literal integer ou
      float seguido do sufixo i (ou j, aceito como alias do lexer). Para um number complexo completo, combina-se parte real
      com parte imaginária usando o operator + (ou -). O type pattern inferido é complex64; o type explícito (complex32/64/128)
      quantiza cada componente.
    syntax_summary: '<literal_inteiro>i          # Ex: 2i'
  - name: complex32, complex64, complex128
    file: KW_TYPE_complex.yaml
    description: Types numéricos complexos com partes real e imaginária (complex32, complex64, complex128).
    syntax_summary: 'mut as complex32: <identificador> [, <identificador> ...]  = <real> + <imag>i   # 2 x float16'
- name: Collection Type - Data
  keywords:
  - name: data
    file: KW_TYPE_data.yaml
    description: Lista de elementos heterogêneos acessíveis por indexação (1-based).
    syntax_summary: 'mut/imut as data: var1, var2, ..., varN [= [<valor>, ...]]'
- name: Collection Type - List
  keywords:
  - name: list
    file: KW_TYPE_list.yaml
    description: Sequência homogênea com index 1-based e assignment por index.
    syntax_summary: 'mut as list of Type: var1, var2, ..., varN [= [<valor>, ...]]'
- name: Collection Type - Map
  keywords:
  - name: map
    file: KW_TYPE_map.yaml
    description: Dicionário com braces string e acesso dinâmico; ausente returns none.
    syntax_summary: 'mut as map: var1, var2, ..., varN [= map{.<chave> of <tipo>: <valor> [of <tipo>], ...}]'
- name: Collection Type - Set
  keywords:
  - name: set
    file: KW_TYPE_set.yaml
    description: Elementos únicos sem ordem; suporta o operator in.
    syntax_summary: 'mut as set of Type: var1, var2, ..., varN [= {<valor>, ...}]'
- name: Tensor Type
  keywords:
  - name: tensor
    file: KW_TYPE_tensor.yaml
    description: Multidimensional type (vector, matrix, N-D tensor) with static shape, stored in a flat buffer and indexed
      by strides (with linear offset and strides). Supports zero-copy O(1) transposition, permutation, slicing (sub-views),
      and zero-stride broadcasting through the strided memory model. Declared with static dimensions and element type (e.g.,
      tensor[2, 2] of int32) or operated dynamically via LinAlgStdLib.
    syntax_summary: 'mut as tensor[<dim1>, <dim2>, ...] of <tipo_elemento>: <var1>, ... [= <valores>]'
- name: Literal
  keywords:
  - name: literal caractere (char_literal)
    file: KW_LITERAL_char.yaml
    description: Literais character (char) representam um único code point Unicode entre single quotes. Em UTF-8, um code
      point ocupa 1 a 4 bytes. Suporta characters imprimíveis e sequências de escape, incluindo \u{XXXX}. O type é char.
    syntax_summary: '''<caractere>''                   # Ex: ''A'', '' '', ''3'', ''é'''
  - name: none (valor nulo)
    file: KW_LITERAL_none.yaml
    description: Representa a ausência de value (nulo/nil/None). É returnsdo por operations que não produce um value útil,
      como acesso a chave ausente em map/data. É exibido como "None" na standard output em todos os backends (interpreter,
      vm, llvm, wasm, wat). There is no uma keyword explícita para criar none; ele surge implicitamente em operations sem
      value de return.
    syntax_summary: '# none não tem sintaxe literal explícita; surge implicitamente:'
  - name: literal string (string_literal)
    file: KW_LITERAL_string.yaml
    description: 'Literais string representam strings de texto entre double quotes. Codificadas em UTF-8; characters não-ASCII
      são aceitos diretamente no literal. Suportam sequências de escape, incluindo \u{XXXX} para code points Unicode. Podem
      conter interpolação de expressions com #{ }. O type é string (dinâmica) ou string(N) (capacidade fixa). len() conta
      bytes UTF-8.'
    syntax_summary: '"<texto_utf8>"                      # String simples'
- name: Boolean Literal
  keywords:
  - name: True, False
    file: KW_LITERAL_bool.yaml
    description: 'Literais booleanos. A forma canônica é PascalCase: True e False. Apenas essas duas formas são aceitas como
      literais; qualquer outra capitalização (true, false, TRUE, FALSE) não é alias e lexa como identifier, causando error
      de variable indefinida.'
    syntax_summary: True | False
- name: Datetime Literal
  keywords:
  - name: datetime (literal ISO 8601)
    file: KW_LITERAL_datetime.yaml
    description: Literais de data e hora no formato ISO 8601. Precisão de nanossegundos; fração pode ter 1-9 dígitos. Sufixo
      Z (UTC) ou offset ±HH, ±HHMM, ±HH:MM. Internamente é um integer de nanossegundos desde a época (1970-01-01T00:00:00Z).
      O type é datetime.
    syntax_summary: <AAAA>-<MM>-<DD>T<HH>:<MM>:<SS>[.<fração>][Z | ±<offset>]
- name: Numeric Literal
  keywords:
  - name: literal float (float_literal)
    file: KW_LITERAL_float.yaml
    description: Literais de dot flutuante representam numbers reais com precisão definida e formatos especiais (float16,
      float32, float64, fp8, bf16, tf32).
    syntax_summary: '<dígitos>.<dígitos> [e<expoente>]    # Ex: 3.14, 2.5e3'
  - name: literal imaginário puro (imaginary_literal)
    file: KW_LITERAL_imaginary.yaml
    description: Literais imaginários representam a componente imaginária pura de um number complexo (ou seja, a forma bi
      onde a parte real a = 0). São formados por um literal numérico integer ou de dot flutuante imediatamente seguido pelo
      sufixo i (ou j, aceito como alias pelo lexer). Sem uma parte real combinada, o value representa um dot puramente sobre
      o eixo imaginário (0.0 + bi).
    syntax_summary: '<literal_inteiro>i          # Ex: 2i'
  - name: literal inteiro (integer_literal)
    file: KW_LITERAL_integer.yaml
    description: Integer numeric literals in decimal base. They are formed by sequences of digits 0 through 9. O sinal negativo
      é um operator unário de prefixo, não fazendo parte do literal. O type pattern inferido é int64, a menos que a declaration
      especifique outro type integer.
    syntax_summary: '<dígitos>         # Ex: 42'
- name: String Interpolation
  keywords:
  - name: '#{ }'
    file: KW_string_interpolation.yaml
    description: 'Interpolação de expressions dentro de strings delimitadas por double quotes. A sintaxe #{expression} evaluates
      a expression e converte o resultado para string no local. Expressões podem conter operations, chamadas de function,
      e qualquer expression válida.'
    syntax_summary: '"texto #{<expressão>} mais texto"'
- name: Comment / Documentation
  keywords:
  - name: '#L, #B ... B#, #D ... D#'
    file: KW_comments.yaml
    description: 'Três formas de comentário na linguagem TheFlux: `#L` para comentários de linha, `#B ... B#` para comentários
      em block multi-linha, e `#D ... D#` para docstrings estruturadas associadas a declarations. Docstrings suportam fields
      no formato bullet (- chave: value) extraídos pelo lexer.'
    syntax_summary: '#L <texto>                            # Comentário de linha (até quebra de linha)'
- name: Instrução de Entrada
  keywords:
  - name: input
    file: KW_input.yaml
    description: 'Reads a line from standard input (stdin) and assigns it to the declared variable. Exibe um prompt optional
      antes da leitura. A declaration de type é required em TheFlux; o type declarado na variable define o type esperado do
      value digitado.

      A verificação de tipagem ocorre depois de pressionar Enter. Se o value digitado for incompatível com o type declarado,
      o prompt volta e escreve em cinza "Digite um <type>, como: <example>".

      '
    syntax_summary: input()
- name: Metaprogramção
  keywords:
  - name: comptime
    file: KW_comptime.yaml
    description: Evaluates uma expression ou block de código at compile time. O resultado é resolvido ou dobrado antes da
      execução em runtime. Útil para pré-computação de expressions constantes e geração estática de dados.
    syntax_summary: comptime <expressão>
  - name: lift
    file: KW_lift.yaml
    description: Cria uma representação de código (árvore sintática / AST) sem avaliá-la imediatamente at runtime (estágio
      de elevação / lifting). Utilizado dentro de definições `meta` para encapsular blocks de código gerados. O código contido
      dentro de `lift` pode receivesr injeções dinâmicas de nós sintáticos ou expressions por meio de `lower()`.
    syntax_summary: lift {
  - name: lower
    file: KW_lower.yaml
    description: Rebaixa (desempacota/injeta) o nó ou expression correspondente dentro de um block `lift { ... }`. Evaluates
      o parameter da meta e insere o nó de código resultante na árvore gerada.
    syntax_summary: lower(<expressão>)
  - name: meta
    file: KW_meta.yaml
    description: Declara uma meta-function de metaprogramção (`meta`) que gera e transforma código at compile time. O body
      de uma definição `meta` returns uma árvore sintática encapsulada em um block `lift { ... }`. Parameters passados para
      a meta-function são injetados no código gerado através da expression `lower(param)`. A expansão de metas é realizada
      estaticamente pelo compilador antes da análise semântica e da geração de código.
    syntax_summary: meta (<nomeCamelCase>) (<params>) {
- name: Operators de Acesso
  keywords:
  - name: ., ::, [], ..
    file: KW_accessors.yaml
    description: 'Operators fundamentais para acesso a membros, resolução de scope, indexação e slicemento em TheFlux:

      - `.` (dot): Field access de instâncias de `struct` e `data`, propriedades de return de operations (`res.sta`, `res.val`,
      `res.msg`) e chamadas de métodos.

      - `::` (colon duplo): Resolução estática de scope para variants de enum (`Enum::Variant`), operations de agents (`Agent::operation`)
      e símbolos de modules.

      - `[ ]` (brackets): Acesso por index posicional em `list` (1-based), acesso associativo por chave em `map` (`mapa["chave"]`),
      e acesso multidimensional em `tensor` (`tensor[i, j]`).

      - `..` (range/slice): Fatiamento contíguo dentro de brackets (`[ini..fim]`, `[..fim]`, `[ini..]`, `[..]`) para listas,
      strings e tensores, além de iteration em ranges.'
    syntax_summary: '<expr>.<campo>                      # Acesso a campo de struct ou data'
- name: Ownership
  keywords:
  - name: borrow
    file: KW_borrow.yaml
    description: Borrowing the values of an identifier without transferring its ownership. borrow() é immutable — multiple
      simultaneous borrows are allowed. borrow_mut() é exclusive — blocks other borrows, moves, and external writes.
    syntax_summary: borrow(<identificador>)
  - name: keep
    file: KW_keep.yaml
    description: Inibe a liberação automática do Eager Flow Disposal, estendendo o tempo de vida do dado. Sem keep(), o compilador
      determina o dot de última usage de cada variable e a libera automaticamente. keep(x) mantém x válido até o final do
      block léxico.
    syntax_summary: keep(<identificador>)
  - name: move
    file: KW_move.yaml
    description: 'Transfere explicitamente a ownership (ownership) de um identifier para outro. Após move(x), a variable x
      é invalidada e não pode mais ser usada até receivesr um novo value. Revivificação: basta atribuir um novo value a x
      para torná-lo válido novamente.'
    syntax_summary: move(<identificador>)
- name: Tarefas Assíncronas (Future / Green Thread)
  keywords:
  - name: async
    file: KW_async.yaml
    description: 'Modifier that turns a function into a non-blocking operation that returns a Future. A function marcada com
      async não bloqueia a pipeline síncrona que a invoca; seu body é evaluatesdo sob demanda e o resultado é resolvido quando
      a pipeline consome o Future com await.

      '
    syntax_summary: async function <nome_camelCase> (<parâmetros>) [as <tipo_retorno>] {
  - name: await
    file: KW_await.yaml
    description: 'Linear synchronization point that suspends the synchronous pipeline until a Future resolves. Ao encontrar
      await, a esteira de execução bloqueia de forma determinística até que o Future associado (gerado por uma function async
      ou despachado por spawn) esteja resolvido, e então returns o seu value.

      '
    syntax_summary: await <expressão_future>
  - name: spawn
    file: KW_spawn.yaml
    description: 'Gatilho de execução assíncrona: autoriza e despacha um nó ou o caminho do dataflow para o runtime, que o
      executes como uma green thread cooperativa. Diferente de async (que apenas marca a function como não-bloqueante), o
      spawn já inicia a execução no runtime, e o await coleta o resultado posteriormente.

      '
    syntax_summary: spawn <expressão>
- name: Telemetry/Debug
  keywords:
  - name: spy
    file: KW_spy.yaml
    description: 'Emits detailed diagnostic telemetry of an expression''s value for runtime inspection and debugging without
      altering the dataflow. Preserves the original value as a transparent tap/tee, allowing spy to be used on operands, intermediate
      expressions, and inside dataflow pipelines.

      The structured telemetry output details the AST origin node, data sample/rank, typing and coercion, hardware dispatch,
      variable liveness, and memory management.'
    syntax_summary: spy(<expressão>)
- name: Unsafe Block
  keywords:
  - name: unsafe
    file: KW_unsafe.yaml
    description: Desativa as proteções de memória do Kernel para manipulação de ponteiros e chamadas C-ABI, APIs, ler e gravar
      Raw Pointers, acessar ou modificar variables globais, implementar contracts não checados, bounds checking e equivalentes.
    syntax_summary: unsafe {
