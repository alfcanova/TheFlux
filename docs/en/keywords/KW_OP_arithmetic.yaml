keyword: +, -, *, /f, /i, /r, ^e, ^r
category: Arithmetic Operator
description: Operatores aritméticos da linguagem TheFlux. Diferencia divisão decimal (/f), divisão inteira (/i) e resto de
  divisão (/r), assim como exponenciação (^e) e radiciação (^r). Os operators seguem a precedência matemática pattern.
syntax: '<expr> + <expr>    # Adição

  <expr> - <expr>    # Subtração

  <expr> * <expr>    # Multiplicação

  <expr> /f <expr>   # Divisão decimal (resultado float)

  <expr> /i <expr>   # Divisão inteira (resultado int)

  <expr> /r <expr>   # Resto da divisão (módulo)

  <expr> ^e <expr>   # Exponenciação (potência)

  <expr> ^r <expr>   # Radiciação (raiz)'
pseudocode: r := a + b - c * d /f e   // + - * /f /i /r ^e ^r
usages:
- name: Operations básicas
  description: Soma, subtração e multiplicação.
  examples:
  - code: 'mut as int64: soma= 2 + 3

      mut as int64: sub= 10 - 4

      mut as int64: mult= 6 * 7'
- name: Divisão especializada
  description: Três formas de divisão para diferentes necessidades.
  examples:
  - code: 'mut as int64: div_int= 7 /i 2     # 3 (divisão inteira)

      mut as float64: div_dec= 7 /f 2   # 3.5 (divisão decimal)

      mut as int64: resto= 7 /r 2       # 1 (resto da divisão)'
- name: Potência e raiz
  description: Exponenciação e radiciação como operators infixos.
  examples:
  - code: 'mut as int64: pot= 2 ^e 3         # 8 (2³)

      mut as float64: raiz= 27 ^r 3     # 3.0 (raiz cúbica de 27)'
restrictions:
- /i requer operandos integers e returns integer (truncado em direção a zero).
- /f converte operandos para float antes da divisão.
- /r é o operator de module (resto da divisão inteira).
- '^e é exponenciação: base^e expoente.'
- '^r é radiciação: base^r index_raiz (ex: 27^r3 = raiz cúbica).'
errors:
- code: RT701
  mnemonic: DIVISION_BY_ZERO
  severity: Error
  trigger: Division (/i or /f) or remainder (/r) operation where divisor is zero
  message: Division by zero in runtime
  hint: Add a conditional check ('route { divisor == 0 ==> ... }') before division
  example_bad: 'mut as int64: x = 10 /i 0

    '
  example_good: "route {\n  divisor == 0 ==> { print(\"erro: zero\") }\n  _ ==> { mut as int64: x = 10 /i divisor }\n}\n"
- code: RT706
  mnemonic: MATH_DOMAIN_LOG
  severity: Error
  trigger: Logarithm calculation (log64, log10_64, log2_64) where argument is less than or equal to zero
  message: 'Argument out of logarithm domain: expected x > 0'
  hint: Ensure value passed to logarithm is strictly positive (x > 0.0)
  example_bad: 'use MathStdLib as M

    mut as float64: l = log64(0.0)

    '
  example_good: "use MathStdLib as M\nroute {\n  x <= 0.0 ==> { print(\"invalido\") }\n  _ ==> { mut as float64: l = log64(x)\
    \ }\n}\n"
- code: RT707
  mnemonic: MATH_DOMAIN_SQRT
  severity: Error
  trigger: Square root or even root calculation (^r 2, squareRoot64) where radicand is negative
  message: 'Negative radicand in even root: expected x >= 0 for real numbers'
  hint: Verify radicand is non-negative (x >= 0.0) before computing root, or use complex numbers
  example_bad: 'use MathStdLib as M

    mut as float64: r = squareRoot64(-4.0)

    '
  example_good: "use MathStdLib as M\nroute {\n  x < 0.0 ==> { print(\"invalido\") }\n  _ ==> { mut as float64: r = squareRoot64(x)\
    \ }\n}\n"
- code: RT708
  mnemonic: MATH_DOMAIN_TRIG
  severity: Error
  trigger: Inverse trigonometric function calculation (asin, acos) with argument outside interval [-1.0, 1.0]
  message: 'Argument out of inverse trigonometric domain: expected -1.0 <= x <= 1.0'
  hint: Clamp argument to interval [-1.0, 1.0] before calling asin or acos
  example_bad: 'use MathStdLib as M

    mut as float64: a = asin64(2.0)

    '
  example_good: "use MathStdLib as M\nroute {\n  (x < -1.0) or (x > 1.0) ==> { print(\"invalido\") }\n  _ ==> { mut as float64:\
    \ a = asin64(x) }\n}\n"
- code: RT709
  mnemonic: MATH_POWER_UNDEFINED
  severity: Error
  trigger: Exponentiation calculation (^e or powerFloat64) with zero base and non-positive exponent
  message: Undefined power for zero base and non-positive exponent
  hint: Avoid raising zero to exponents less than or equal to zero (0^0 or 0^(-k))
  example_bad: 'use MathStdLib as M

    mut as float64: p = powerFloat64(0.0, -1.0)

    '
  example_good: "use MathStdLib as M\nroute {\n  (b == 0.0) and (e <= 0.0) ==> { print(\"indefinido\") }\n  _ ==> { mut as\
    \ float64: p = powerFloat64(b, e) }\n}\n"
