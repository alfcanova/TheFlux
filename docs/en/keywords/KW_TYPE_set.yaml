keyword: set
category: Collection Type - Set
description: Elementos únicos sem ordem; suporta o operator in.
syntax: 'mut as set of Type: var1, var2, ..., varN [= {<valor>, ...}]'
pseudocode: 'conjunto : CONJUNTO DE string   // elementos unicos, sem ordem'
usages:
- name: Conjunto (set)
  description: Elementos únicos sem ordem; suporta o operator in.
  examples:
  - code: 'mut as set of string: sensores = {"temp", "pressao", "temp", "vibracao"}

      print(sensores)     # {"temp", "pressao", "vibracao"}

      print("temp" in sensores)   # true'
restrictions:
- 'set REQUER ''of Type'' (ex: ''set of string'').'
- Set não suporta slice ou indexação individual.
errors:
- code: SYN161
  mnemonic: SET_REQUIRES_OF_TYPE
  severity: Error
  trigger: Set declaration without 'of <type>' specifying element type
  message: 'Set declaration requires element type: ''set of <type>'''
  hint: 'Specify element type with ''of'': ''mut as set of string: my_set'''
  example_bad: 'mut as set: s = {"a", "b"}

    '
  example_good: 'mut as set of string: s = {"a", "b"}

    '
