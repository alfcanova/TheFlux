keyword: complex32, complex64, complex128
category: Numeric Type - Complex
description: Types numéricos complexos com partes real e imaginária (complex32, complex64, complex128).
syntax: 'mut as complex32: <identificador> [, <identificador> ...]  = <real> + <imag>i   # 2 x float16

  mut as complex64: <identificador> [, <identificador> ...]  = <real> + <imag>i   # 2 x float32

  mut as complex128: <identificador> [, <identificador> ...] = <real> + <imag>i   # 2 x float64'
pseudocode: 'num : COMPLEXO128 = 1 + 2i   // parte real + parte imaginaria'
usages:
- name: Declaration de types complexos
  description: Declara variables com types numéricos complexos compostos por parte real e imaginária.
  examples:
  - code: 'mut as complex32: c32 = -1.5 + -2.5i

      mut as complex64: c64 = 64.125 + -8.5i

      mut as complex128: c128 = 1.5 + 2.5i'
restrictions:
- 'O sufixo i (ou j) indica a parte imaginária (ex: 2.5i).'
- complex32 usa 2 componentes float16; complex64 usa 2 float32; complex128 usa 2 float64.
- bigcomplex é reservado para versões futuras.
- 'Ver também KW_LITERAL_complex.yaml (literal) — types e literais são files espelhados: TYPES descreve a forma in the declaration,
  LITERAL descreve a sintaxe do value.'
errors:
- code: TYP411
  mnemonic: EXPECT_COMPLEX_GOT_INT
  severity: Error
  trigger: Variable or parameter of type complex receives an integer
  message: Expected complex, got integer (int)
  hint: 'Construct complex number: ''10 + 0i'' or use complex constructor'
  example_bad: 'mut as complex128: c = 42

    '
  example_good: 'mut as complex128: c = 42 + 0i

    '
- code: TYP412
  mnemonic: EXPECT_COMPLEX_GOT_FLOAT
  severity: Error
  trigger: Variable or parameter of type complex receives a float
  message: Expected complex, got float
  hint: 'Construct complex number with zero imaginary part: ''3.14 + 0i'''
  example_bad: 'mut as complex128: c = 3.14

    '
  example_good: 'mut as complex128: c = 3.14 + 0.0i

    '
- code: TYP413
  mnemonic: EXPECT_COMPLEX_GOT_STRING
  severity: Error
  trigger: Variable or parameter of type complex receives a string text
  message: Expected complex, got string
  hint: Parse string to complex using ConvertStdLib parser
  example_bad: 'mut as complex128: c = "1+2i"

    '
  example_good: 'mut as complex128: c = parse_complex("1+2i")

    '
- code: TYP414
  mnemonic: EXPECT_COMPLEX_GOT_BOOL
  severity: Error
  trigger: Variable or parameter of type complex receives a boolean
  message: Expected complex, got bool
  hint: Use explicit route branch to produce complex value
  example_bad: 'mut as complex128: c = true

    '
  example_good: 'mut as complex128: c = (true as int64) + 0i

    '
