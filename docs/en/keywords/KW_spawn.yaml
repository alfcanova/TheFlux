keyword: spawn
category: Tarefas Assíncronas (Future / Green Thread)
description: 'Gatilho de execução assíncrona: autoriza e despacha um nó ou o caminho do dataflow para o runtime, que o executes
  como uma green thread cooperativa. Diferente de async (que apenas marca a function como não-bloqueante), o spawn já inicia
  a execução no runtime, e o await coleta o resultado posteriormente.

  '
syntax: 'spawn <expressão>

  '
usages:
- name: Despacho de pipeline para o runtime
  description: Autoriza e despacha um caminho do dataflow como green thread; o resultado é coletado com await.
  examples:
  - code: 'mut g = spawn (dobro(20 + 1) --> print)

      print(await g)

      '
- name: Despacho de nó do dataflow
  description: Despacha um nó isolado do grafo de fluxo para execução assíncrona no runtime.
  examples:
  - code: 'mut n = spawn dobro(42)

      print(await n)

      '
restrictions:
- O spawn autoriza e despacha o nó ou caminho do dataflow para o runtime como green thread.
- A execução ocorre de forma cooperativa e não-bloqueante; o resultado é coletado com await.
- Só pode envolver values assíncronos (Future) ou pipelines despacháveis.
errors:
- code: CON601
  mnemonic: FSM_INVALID_STATE_TRANSITION
  severity: Error
  trigger: FSM transition to target state that is not declared or permitted from current state
  message: 'Invalid FSM state transition: target state not permitted from current state'
  hint: Verify FSM transitions definition and add transition rule or transition through allowed state
  example_bad: '# Transição direta de Inicializado para Finalizado sem passar por Executando

    '
  example_good: '# Seguir o ciclo de vida: Inicializado -> Executando -> Finalizado

    '
- code: CON602
  mnemonic: CHANNEL_SEND_ON_CLOSED
  severity: Error
  trigger: Attempt to send message or data on a closed communication channel
  message: 'Cannot send on closed channel: channel is no longer accepting messages'
  hint: Check channel state with channelIsOpen() before sending messages
  example_bad: 'channelClose(ch)

    channelSend(ch, "mensagem")

    '
  example_good: 'channelSend(ch, "mensagem")

    channelClose(ch)

    '
