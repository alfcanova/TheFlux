keyword: string, string(N)
category: String Type
description: 'Types de texto. string é dinâmica (alocação sob demanda); string(N) é estática com capacidade fixa de N bytes
  UTF-8. O type genérico is required in the declaration (mut as string: x = ...). Char tem doc próprio: KW_TYPE_char.yaml.'
syntax: 'mut as string: <var> = <valor>        # dinâmica (fat pointer)

  mut as string(50): <var> = <valor>    # estática, 50 bytes UTF-8'
pseudocode: 's : STRING      // dinamica (alocacao sob demanda)

  f : STRING(32)  // capacidade fixa de N bytes'
usages:
- name: String dinâmica
  description: Cresce conforme necessário; alocação por heap.
  examples:
  - code: 'mut as string: nome = "TheFlux"

      mut as string: saudacao = "Olá, " + nome'
- name: String estática
  description: Capacidade fixa; assignment que exceda N bytes é error.
  examples:
  - code: 'mut as string(16): codigo = "A1B2"'
restrictions:
- 'string(N): N > 0, medido em bytes UTF-8; literal maior que N é error compile-time; assignment runtime acima do cap é error
  claro; concat além do cap é error.'
- string (dinâmica) é o type pattern quando there is no parameter.
- len() de string conta bytes UTF-8, não code points.
- 'Backends: fat pointer (ptr << 32 | len) em wasm/wat; i8* + printf %s em llvm (NUL interno trunca na impressão).'
- 'Sintaxe string(N) usa parentheses; divergência conhecida: tensor[N] usa brackets — decisão de design documentada.'
- Ver também KW_LITERAL_string.yaml, KW_LITERAL_char.yaml (literais) e KW_TYPE_char.yaml (type char).
errors:
- code: TYP431
  mnemonic: EXPECT_STRING_GOT_INT
  severity: Error
  trigger: Variable or parameter of type string receives an integer
  message: Expected string, got integer (int)
  hint: Convert integer to string with ConvertStdLib::int64ToString() or string interpolation
  example_bad: 'mut as string: s = 42

    '
  example_good: 'mut as string: s = "$(42)"

    '
- code: TYP432
  mnemonic: EXPECT_STRING_GOT_FLOAT
  severity: Error
  trigger: Variable or parameter of type string receives a float
  message: Expected string, got float
  hint: Convert float to string with ConvertStdLib::float64ToString()
  example_bad: 'mut as string: s = 3.14

    '
  example_good: 'mut as string: s = "$(3.14)"

    '
- code: TYP433
  mnemonic: EXPECT_STRING_GOT_COMPLEX
  severity: Error
  trigger: Variable or parameter of type string receives a complex number
  message: Expected string, got complex
  hint: Convert complex to string formatting real and imaginary parts
  example_bad: 'mut as string: s = 1 + 2i

    '
  example_good: 'mut as string: s = "$(1 + 2i)"

    '
- code: TYP434
  mnemonic: EXPECT_STRING_GOT_BOOL
  severity: Error
  trigger: Variable or parameter of type string receives a boolean
  message: Expected string, got bool
  hint: 'Convert boolean to string: ''route { b ==> "true"; _ ==> "false" }'''
  example_bad: 'mut as string: s = true

    '
  example_good: 'mut as string: s = "$(true)"

    '
