keyword: contract
category: Contract Declaration
description: 'Declara um contract que define um conjunto de assinaturas de operations (op) que um agent (agent) pode implementar.
  O contract é uma interface que especifica nomes, parameters e types de return sem implementação.

  Contracts são válidos apenas em files .fdsl. The contract name must be in PascalCase. '
syntax: "contract (<Nome_PascalCase>) {\n      op <nome_camelCase> ([mut | imut | as] <tipo>: <identificador> [, ...]) [as\
  \ <tipo_retorno>]\n      op <nome_camelCase> () [as <tipo_retorno>]\n      ...\n}\n"
pseudocode: "CONTRATO Operavel:\n    assinatura ligar()\n    assinatura desligar()\n// conjunto de assinaturas que um agente\
  \ pode implementar"
usages:
- name: Contract com operations simples
  description: Contract com ops sem parameters.
  examples:
  - code: "contract (Readable) {\n      op read () as int64\n}\n"
- name: Contract com operations parametrizadas
  description: Contract para operations matemáticas básicas com parameters nomeados.
  examples:
  - code: "contract (OperacoesBasicas) {\n      op somar (as int64: a, as int64: b) as int64\n      op subtrair (as int64:\
      \ a, as int64: b) as int64\n      op multiplicar (as int64: a, as int64: b) as int64\n      op dividirInteiro (as int64:\
      \ a, as int64: b) as int64\n}\n"
- name: Múltiplos contracts no mesmo file
  description: Dois contracts declarados sequencialmente em um .fdsl.
  examples:
  - code: "contract (ReadOp) {\n      op read () as int64\n}\ncontract (WriteOp) {\n      op write () as int64\n}\n"
restrictions:
- O nome do contrato deve estar em PascalCase (SEM330).
- Operações em contratos não podem ter corpo (apenas assinatura) (SYN130).
- As operações declaradas dentro do contrato devem seguir camelCase (SEM331).
- Deve haver pelo menos uma operação no contrato.
- Contratos são válidos apenas em arquivos .fdsl (não em .flux).
- Agentes implementam contratos via a cláusula `impl` na declaração `agent`.
errors:
- code: SEM330
  mnemonic: CONTRACT_NAME_PASCAL_CASE
  severity: Error
  trigger: Contract identifier not in PascalCase
  message: Contract name must strictly follow PascalCase convention
  hint: 'Rename contract using PascalCase: ''contract (MyContract)'''
  example_bad: "contract (meuContrato) {\n  op executar() as int64\n}\n"
  example_good: "contract (MeuContrato) {\n  op executar() as int64\n}\n"
- code: SEM331
  mnemonic: CONTRACT_OP_CAMEL_CASE
  severity: Error
  trigger: Operation identifier inside contract not in camelCase
  message: Contract operation name must strictly follow camelCase convention
  hint: 'Rename operation using camelCase: ''op calculateTotal'''
  example_bad: "contract (Processador) {\n  op ExecutarTarefa() as bool\n}\n"
  example_good: "contract (Processador) {\n  op executarTarefa() as bool\n}\n"
- code: SYN130
  mnemonic: CONTRACT_OP_CANNOT_HAVE_BODY
  severity: Error
  trigger: Operation inside 'contract' declared with execution body '==> { ... }'
  message: Operations within 'contract' define signatures only and cannot have execution bodies
  hint: Remove the operation body ('==> { ... }'); implementations belong exclusively to 'agent'
  example_bad: "contract (Servico) {\n  op somar(as int64: a) as int64 ==> { emit(nice, a + 1, \"ok\") }\n}\n"
  example_good: "contract (Servico) {\n  op somar(as int64: a) as int64\n}\n"
