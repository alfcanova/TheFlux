keyword: program
category: Entry Point
description: Declara o dot de entrada required de um file .flux.  O  program must be a última declaration no file e é o block
  principal executesdo. O nome do program deve estar em PascalCase. Essa keyword é proibida  em files .fdsl.
syntax: "program (<nome_PascalCase>) {\n    <declarações>\n}"
pseudocode: "PROGRAMA Nome:\n    instrucoes...\nFIM PROGRAMA"
usages:
- name: Program simples
  description: Dot de entrada principal com body de execução.
  examples:
  - code: "program (Main) {\n      print(\"Hello, World!\")\n}"
  - code: "program (MathTest) {\n      imut as int64: VALOR = 42\n      print(VALOR)\n}"
  - code: program (Empty) {}
- name: Program com declarations internas
  description: Program pode conter declarations de variables, route, infinite, etc.
  examples:
  - code: "program (ExampleOfRoute) {\n      route {\n            false ==> { print(\"Deve Imprimir\") }\n            true\
      \  ==> { print(\"Nao deve imprimir\") }\n            _     ==> { print(\"saindo!\") }\n      }\n}"
  - code: "program (Variables) {\n      mut as int64: x = 10\n      mut as float64: y = 3.14\n      print(x + y)\n}"
  - code: "program (Dataflow) {\n      mut as string: nome = \"TheFlux\"\n      nome --> print\n}"
  - code: "program (Resultado) {\n      imut as int64: r = calc(5)\n      print(r.sta)     # \"nice\"\n      print(r.val)\
      \     # 5\n      print(r.msg)     # \"ok\"\n}"
restrictions:
- Apenas uma declaration `program` é permitida por file.
- O nome do `program` (<nome_PascalCase>) deve estar em PascalCase.
- '`program` é required e must be a última declaration em files .flux.'
- '`program` é proibida em files .fdsl.'
- O block da declaration `program` define o scope raiz da aplicação.
- Nenhuma outra declaration pode existir após o encerramento do block da declaration `program`.
errors:
- code: SYN100
  mnemonic: UNEXPECTED_TOKEN
  severity: Error
  trigger: Unexpected token encountered during syntactic analysis
  message: Unexpected token in declaration
  hint: Check TheFlux grammar syntax and replace invalid tokens with canonical forms
  example_bad: "program (Main) {\n  mut as int64: x == 10\n}\n"
  example_good: "program (Main) {\n  mut as int64: x = 10\n}\n"
- code: SEM310
  mnemonic: PROGRAM_NAME_PASCAL_CASE
  severity: Error
  trigger: Execution of code or statements outside of any function, agent operation, or program block
  message: Statements not allowed at root file level; code must reside inside 'program', 'function', or 'agent'
  hint: Wrap executable statements inside 'program (Name) { ... }'
  example_bad: 'program (meuPrograma) { }

    '
  example_good: 'program (MeuPrograma) { }

    '
- code: SEM311
  mnemonic: PROGRAM_PROHIBITED_IN_FDSL
  severity: Error
  trigger: More than one 'program' block declared in the same .flux file
  message: Multiple 'program' blocks in the same file; only one entry point is allowed per file
  hint: Consolidate logic into a single 'program (Name) { ... }' entry point
  example_bad: '# Em MinhaLib.fdsl

    program (Main) { }

    '
  example_good: '# Em MinhaLib.fdsl

    agent (MinhaLib) { }

    '
- code: SEM312
  mnemonic: PROGRAM_MISSING_IN_FLUX
  severity: Error
  trigger: Program block identifier not matching filename or not in PascalCase
  message: Program name must follow PascalCase and match file stem
  hint: 'Ensure program name is in PascalCase: ''program (ExampleProgram)'''
  example_bad: '# Arquivo sem bloco program

    print("ola")

    '
  example_good: "program (Main) {\n  print(\"ola\")\n}\n"
- code: SYN140
  mnemonic: UNCLOSED_DELIMITER
  severity: Error
  trigger: 'Unbalanced delimiters: parentheses, brackets, or curly braces not matching'
  message: 'Unbalanced delimiter: expected matching closing delimiter'
  hint: Ensure all '(', '[', and '{' have corresponding ')', ']', and '}' in the correct scope
  example_bad: "program (Main {\n  print(\"ola\")\n}\n"
  example_good: "program (Main) {\n  print(\"ola\")\n}\n"
- code: TYP499
  mnemonic: TYPE_MISMATCH_GENERIC
  severity: Error
  trigger: 'Type incompatibility: expected and actual types are not compatible'
  message: 'Generic type mismatch: types are incompatible'
  hint: Verify types of expressions and convert values explicitly with 'as <type>'
  example_bad: 'mut as int64: x = (1 > 0)

    '
  example_good: 'mut as int64: x = 1

    '
