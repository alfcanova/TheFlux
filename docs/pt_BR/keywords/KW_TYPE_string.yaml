keyword: string, string(N)
category: Tipo String
description: 'Tipos de texto. string é dinâmica (alocação sob demanda); string(N) é estática com capacidade fixa de N bytes
  UTF-8. O tipo genérico é obrigatório na declaração (mut as string: x = ...). Char tem doc próprio: KW_TYPE_char.yaml.'
syntax: 'mut as string: <var> = <valor>        # dinâmica (fat pointer)

  mut as string(50): <var> = <valor>    # estática, 50 bytes UTF-8'
pseudocode: 's : STRING      // dinamica (alocacao sob demanda)

  f : STRING(32)  // capacidade fixa de N bytes'
usages:
- name: String dinâmica
  description: Cresce conforme necessário; alocação por heap.
  examples:
  - code: 'mut as string: nome = "TheFlux"

      mut as string: saudacao = "Olá, " + nome'
- name: String estática
  description: Capacidade fixa; atribuição que exceda N bytes é erro.
  examples:
  - code: 'mut as string(16): codigo = "A1B2"'
restrictions:
- 'string(N): N > 0, medido em bytes UTF-8; literal maior que N é erro compile-time; atribuição runtime acima do cap é erro
  claro; concat além do cap é erro.'
- string (dinâmica) é o tipo padrão quando não há parâmetro.
- len() de string conta bytes UTF-8, não code points.
- 'Backends: fat pointer (ptr << 32 | len) em wasm/wat; i8* + printf %s em llvm (NUL interno trunca na impressão).'
- 'Sintaxe string(N) usa parênteses; divergência conhecida: tensor[N] usa colchetes — decisão de design documentada.'
- Ver também KW_LITERAL_string.yaml, KW_LITERAL_char.yaml (literais) e KW_TYPE_char.yaml (tipo char).
errors:
- code: "TYP431"
  mnemonic: "EXPECT_STRING_GOT_INT"
  severity: "Error"
  trigger: "Uma variável ou parâmetro do tipo string recebe um número inteiro"
  message: "A variável esperava texto (string) e recebeu um número inteiro"
  hint: "Use interpolação \"$(x)\" ou função de conversão para formatar o inteiro como texto"
  example_bad: |
    mut as string: s = 42
  example_good: |
    mut as string: s = "$(42)"
- code: "TYP432"
  mnemonic: "EXPECT_STRING_GOT_FLOAT"
  severity: "Error"
  trigger: "Uma variável ou parâmetro do tipo string recebe um número decimal"
  message: "A variável esperava texto (string) e recebeu um número decimal (float)"
  hint: "Use interpolação \"$(x)\" para formatar o número decimal como texto"
  example_bad: |
    mut as string: s = 3.14
  example_good: |
    mut as string: s = "$(3.14)"
- code: "TYP433"
  mnemonic: "EXPECT_STRING_GOT_COMPLEX"
  severity: "Error"
  trigger: "Uma variável ou parâmetro do tipo string recebe um número complexo"
  message: "A variável esperava texto (string) e recebeu um número complexo"
  hint: "Use interpolação \"$(c)\" para formatar o número complexo como texto"
  example_bad: |
    mut as string: s = 1 + 2i
  example_good: |
    mut as string: s = "$(1 + 2i)"
- code: "TYP434"
  mnemonic: "EXPECT_STRING_GOT_BOOL"
  severity: "Error"
  trigger: "Uma variável ou parâmetro do tipo string recebe um valor booleano"
  message: "A variável esperava texto (string) e recebeu um booleano (bool)"
  hint: "Use interpolação \"$(b)\" para converter o booleano em texto ('true'/'false')"
  example_bad: |
    mut as string: s = true
  example_good: |
    mut as string: s = "$(true)"

