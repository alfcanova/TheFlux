keyword: use
category: Declaração de Importação
description: Importa agentes ou operações de agentes de outros módulos. Pode importar um agente inteiro com alias, uma operação
  específica com alias, ou um grupo de operações de um agente.
syntax: 'use <AgentePascalCase> as <AliasPascalCase>

  use <AgentePascalCase>::<operacao_camelCase> as <alias_camelCase>

  use <AgentePascalCase>::{ <op> [as <alias>], ... }'
pseudocode: 'USAR Modulo::Operacao        // importa operacao especifica

  USAR Calc COMO Aritmetica    // importa agente com alias'
usages:
- name: Importar agente com alias
  description: Importa um agente completo com um alias; operações são usadas via Alias::op.
  examples:
  - code: use AgentOfPrint as AP
  - code: use AgentOfMath as AM
- name: Importar operação específica
  description: Importa uma operação específica de um agente com alias; a operação passa a ser chamável pelo alias.
  examples:
  - code: use AgentOfMath::dot as produtoEscalar
- name: Importar grupo de operações
  description: Importa múltiplas operações de um agente.
  examples:
  - code: "use AgentOfMath::{\n    dot as produtoEscalar,\n    crux,\n    inverse\n}"
- name: Uso de agente importado
  description: Utiliza operações do agente importado via alias e ::.
  examples:
  - code: AP::printNome
  - code: AM::printNome
- name: Uso de operação importada com alias
  description: Chama diretamente a operação importada pelo alias.
  examples:
  - code: produtoEscalar(2, 3)
  - code: meuPrint()
restrictions:
- Nomes de agentes e aliases de agentes devem estar em PascalCase.
- Nomes de operações e aliases de operações devem estar em camelCase.
- 'Aliases de operações são chamados como função: `alias(args)`.'
- 'Aliases de agentes são usados com `::` para acessar operações: `Alias::op(args)`.'
- Declarações `use` devem vir no início do arquivo, antes de outras declarações.
errors:
- code: "IMP201"
  mnemonic: "MODULE_NOT_FOUND"
  severity: "Error"
  trigger: "Módulo ou arquivo .fdsl especificado na cláusula 'use' não encontrado nos caminhos de busca"
  message: "Módulo ou arquivo .fdsl não encontrado nos diretórios de busca ou stdlib"
  hint: "Verifique se o caminho do arquivo .fdsl existe e está no diretório correto ou no FLUX_PATH"
  example_bad: |
    use ModuloInexistente as MI
  example_good: |
    use MathStdLib as MS
- code: "IMP202"
  mnemonic: "CIRCULAR_IMPORT"
  severity: "Error"
  trigger: "Dependência cíclica detectada entre módulos (A importa B, que importa A)"
  message: "Dependência cíclica de importação detectada entre módulos .fdsl"
  hint: "Quebre a dependência cíclica movendo os tipos comuns para um arquivo agregado mestre"
  example_bad: |
    # ModuloA importa ModuloB e ModuloB importa ModuloA
    use ModuloB
  example_good: |
    use ModuloComum
- code: "IMP203"
  mnemonic: "PRIVATE_OP_ACCESS"
  severity: "Error"
  trigger: "Tentativa de importar ou acessar externamente uma operação privada (iniciada com '_')"
  message: "Operações iniciadas com '_' são privadas e não podem ser importadas externamente"
  hint: "Operações iniciadas com '_' são privadas ao módulo; utilize apenas operações públicas do contrato"
  example_bad: |
    use CalculadoraAgent::_auxiliar as aux
  example_good: |
    use CalculadoraAgent::somar as somar
- code: "IMP204"
  mnemonic: "DUPLICATE_IMPORT_ALIAS"
  severity: "Error"
  trigger: "Dois ou mais módulos ou operações importados com o mesmo alias no mesmo arquivo"
  message: "Colisão de identificador: o alias já foi utilizado em outra cláusula de importação"
  hint: "Utilize 'use <Modulo> as <NovoAlias>' para evitar colisão de nomes no escopo"
  example_bad: |
    use ModuloA as M
    use ModuloB as M
  example_good: |
    use ModuloA as MA
    use ModuloB as MB
