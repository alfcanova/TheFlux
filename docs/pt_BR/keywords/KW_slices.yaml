keyword: slices
category: Operador de Range / Slice
description: 'Slices extraem fatias de coleções e strings usando o operador de range .. dentro de delimitadores. O delimitador
  depende do tipo: colchetes [ ] para list, data e tensor; parênteses ( ) para string. O range é inclusivo em ambas as extremidades
  e os índices são 1-based.'
syntax: 'lista[ .. ]              # Slice completo (cópia)

  lista[x .. ]             # De x até o final

  lista[ .. y]             # Do início até y

  lista[x .. y]            # De x até y (inclusivo)

  texto( .. )              # String completa (cópia)

  texto(x .. )             # Substring de x até o final

  texto( .. y)             # Substring do início até y

  texto(x .. y)            # Substring de x até y (inclusivo)'
pseudocode: 'numeros := [1, 2, 3, 4, 5]

  fatia   := numeros[2..4]   // extrai subcolecao'
usages:
- name: Slice de lista
  description: Extrai uma fatia de uma list com colchetes.
  examples:
  - code: 'mut as list of int64: valores = [10, 20, 30, 40, 50]

      print(valores[ .. ])     # [10, 20, 30, 40, 50]

      print(valores[ .. 3])    # [10, 20, 30]

      print(valores[2 .. ])    # [20, 30, 40, 50]

      print(valores[2 .. 4])   # [20, 30, 40]'
- name: Slice de tensor
  description: Fatia a primeira dimensão de um tensor com colchetes; passo é suportado apenas em tensor.
  examples:
  - code: 'mut as tensor[4] of int64: t = tensor([1, 2, 3, 4])

      print(t[2 .. 4])         # [2, 3, 4]

      print(t[1 .. 4 .. 2])    # [1, 3]'
- name: Slice de data
  description: Fatia uma lista de data (registros) com colchetes.
  examples:
  - code: 'mut as list of data: itens = [{a: 1}, {a: 2}, {a: 3}]

      print(itens[2 .. 3])     # [{a: 2}, {a: 3}]'
- name: Slice de string
  description: Extrai uma substring com parênteses; índices contam codepoints Unicode.
  examples:
  - code: 'mut as string: texto = "flux"

      print(texto( .. ))       # flux

      print(texto( .. 3))      # flu

      print(texto(2 .. ))      # lux

      print(texto(2 .. 3))     # lu'
restrictions:
- Índices são 1-based e o fim é inclusivo.
- Início, fim ou ambos podem ser omitidos; omitidos assumem o início/fim da coleção.
- Fora do intervalo válido (1..tamanho) ou início maior que fim gera erro em tempo de execução.
- Passo (sintaxe `[início .. fim .. passo]`) só é suportado em tensor; em list e string gera erro.
- Set e map não suportam slice.
- 'O delimitador segue o tipo: [ ] para list/data/tensor, ( ) para string.'
