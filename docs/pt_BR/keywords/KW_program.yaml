keyword: program
category: Ponto de Entrada
description: Declara o ponto de entrada obrigatório de um arquivo .flux.  O  programa deve ser a última declaração no arquivo
  e é o bloco principal executado. O nome do programa deve estar em PascalCase. Essa keyword é proibida  em arquivos .fdsl.
syntax: "program (<nome_PascalCase>) {\n    <declarações>\n}"
pseudocode: "PROGRAMA Nome:\n    instrucoes...\nFIM PROGRAMA"
usages:
- name: Programa simples
  description: Ponto de entrada principal com corpo de execução.
  examples:
  - code: "program (Main) {\n      print(\"Hello, World!\")\n}"
  - code: "program (MathTest) {\n      imut as int64: VALOR = 42\n      print(VALOR)\n}"
  - code: program (Empty) {}
- name: Programa com declarações internas
  description: Programa pode conter declarações de variáveis, route, infinite, etc.
  examples:
  - code: "program (ExampleOfRoute) {\n      route {\n            false ==> { print(\"Deve Imprimir\") }\n            true\
      \  ==> { print(\"Nao deve imprimir\") }\n            _     ==> { print(\"saindo!\") }\n      }\n}"
  - code: "program (Variables) {\n      mut as int64: x = 10\n      mut as float64: y = 3.14\n      print(x + y)\n}"
  - code: "program (Dataflow) {\n      mut as string: nome = \"TheFlux\"\n      nome --> print\n}"
  - code: "program (Resultado) {\n      imut as int64: r = calc(5)\n      print(r.sta)     # \"nice\"\n      print(r.val)\
      \     # 5\n      print(r.msg)     # \"ok\"\n}"
restrictions:
- Apenas uma declaração `program` é permitida por arquivo.
- O nome do `program` (<nome_PascalCase>) deve estar em PascalCase (SEM310).
- '`program` é obrigatória e deve ser a última declaração em arquivos .flux (SEM312).'
- '`program` é proibida em arquivos .fdsl (SEM311).'
- O bloco da declaração `program` define o escopo raiz da aplicação.
- Nenhuma outra declaração pode existir após o encerramento do bloco da declaração `program`.
errors:
- code: "SYN100"
  mnemonic: "UNEXPECTED_TOKEN"
  severity: "Error"
  trigger: "Token inesperado encontrado durante a análise sintática"
  message: "Símbolo ou estrutura sintática inesperada encontrada no código"
  hint: "Verifique a sintaxe ao redor do token indicado"
  example_bad: |
    program (Main) {
      mut as int64: x == 10
    }
  example_good: |
    program (Main) {
      mut as int64: x = 10
    }
- code: "SEM310"
  mnemonic: "PROGRAM_NAME_PASCAL_CASE"
  severity: "Error"
  trigger: "Nome de 'program' declarado fora da convenção PascalCase"
  message: "Nome de 'program' deve utilizar a convenção PascalCase"
  hint: "Renomeie o programa para iniciar com letra maiúscula (ex: 'program (Main)')"
  example_bad: |
    program (meuPrograma) { }
  example_good: |
    program (MeuPrograma) { }
- code: "SEM311"
  mnemonic: "PROGRAM_PROHIBITED_IN_FDSL"
  severity: "Error"
  trigger: "Declaração de 'program' dentro de arquivo de biblioteca (.fdsl)"
  message: "Declaração de 'program' é proibida em arquivos .fdsl"
  hint: "Arquivos .fdsl devem conter apenas bibliotecas, contratos e agentes"
  example_bad: |
    # Em MinhaLib.fdsl
    program (Main) { }
  example_good: |
    # Em MinhaLib.fdsl
    agent (MinhaLib) { }
- code: "SEM312"
  mnemonic: "PROGRAM_MISSING_IN_FLUX"
  severity: "Error"
  trigger: "Arquivo executável (.flux) sem a declaração obrigatória 'program'"
  message: "Arquivo .flux requer declaração do ponto de entrada 'program (<Nome>) { ... }'"
  hint: "Adicione o bloco 'program (<Nome>) { ... }' ao final do arquivo .flux"
  example_bad: |
    # Arquivo sem bloco program
    print("ola")
  example_good: |
    program (Main) {
      print("ola")
    }
- code: "SYN140"
  mnemonic: "UNCLOSED_DELIMITER"
  severity: "Error"
  trigger: "Delimitador '(' ou '{' ou '[' não fechado antes do fim do escopo ou arquivo"
  message: "Delimitador não fechado: esperado fechamento correspondente ')', '}' ou ']'"
  hint: "Feche o delimitador correspondente (')', '}' ou ']') antes do final do bloco"
  example_bad: |
    program (Main {
      print("ola")
    }
  example_good: |
    program (Main) {
      print("ola")
    }
- code: "TYP499"
  mnemonic: "TYPE_MISMATCH_GENERIC"
  severity: "Error"
  trigger: "Incompatibilidade de tipos genérica sem mapeamento direcional específico"
  message: "Incompatibilidade de tipos: os tipos esperados e fornecidos não são compatíveis"
  hint: "Verifique a compatibilidade dos tipos ou utilize conversão explícita com 'as <tipo>'"
  example_bad: |
    mut as int64: x = (1 > 0)
  example_good: |
    mut as int64: x = 1

