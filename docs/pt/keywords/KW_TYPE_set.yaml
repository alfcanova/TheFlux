keyword: set
category: Tipo de Coleção - Set
description: Elementos únicos sem ordem; suporta o operador in.
syntax: 'mut as set of Type: var1, var2, ..., varN [= {<valor>, ...}]'
pseudocode: 'conjunto : CONJUNTO DE string   // elementos unicos, sem ordem'
usages:
- name: Conjunto (set)
  description: Elementos únicos sem ordem; suporta o operador in.
  examples:
  - code: 'mut as set of string: sensores = {"temp", "pressao", "temp", "vibracao"}

      print(sensores)     # {"temp", "pressao", "vibracao"}

      print("temp" in sensores)   # true'
restrictions:
- 'set REQUER ''of Type'' (ex: ''set of string'').'
- Set não suporta slice ou indexação individual.
errors:
- code: "SYN161"
  mnemonic: "SET_REQUIRES_OF_TYPE"
  severity: "Error"
  trigger: "Declaração de 'set' sem especificar o tipo dos elementos com 'of <tipo>'"
  message: "Tipo 'set' requer especificação do tipo de elemento com 'of <tipo>'"
  hint: "Especifique o tipo dos elementos com 'of <tipo>' (ex: 'set of string')"
  example_bad: |
    mut as set: s = {"a", "b"}
  example_good: |
    mut as set of string: s = {"a", "b"}
