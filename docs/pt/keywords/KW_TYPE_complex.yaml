keyword: complex32, complex64, complex128
category: Tipo Numérico - Complexo
description: Tipos numéricos complexos com partes real e imaginária (complex32, complex64, complex128).
syntax: 'mut as complex32: <identificador> [, <identificador> ...]  = <real> + <imag>i   # 2 x float16

  mut as complex64: <identificador> [, <identificador> ...]  = <real> + <imag>i   # 2 x float32

  mut as complex128: <identificador> [, <identificador> ...] = <real> + <imag>i   # 2 x float64'
pseudocode: 'num : COMPLEXO128 = 1 + 2i   // parte real + parte imaginaria'
usages:
- name: Declaração de tipos complexos
  description: Declara variáveis com tipos numéricos complexos compostos por parte real e imaginária.
  examples:
  - code: 'mut as complex32: c32 = -1.5 + -2.5i

      mut as complex64: c64 = 64.125 + -8.5i

      mut as complex128: c128 = 1.5 + 2.5i'
restrictions:
- 'O sufixo i (ou j) indica a parte imaginária (ex: 2.5i).'
- complex32 usa 2 componentes float16; complex64 usa 2 float32; complex128 usa 2 float64.
- bigcomplex é reservado para versões futuras.
- 'Ver também KW_LITERAL_complex.yaml (literal) — tipos e literais são arquivos espelhados: TYPES descreve a forma na declaração,
  LITERAL descreve a sintaxe do valor.'
errors:
- code: "TYP411"
  mnemonic: "EXPECT_COMPLEX_GOT_INT"
  severity: "Error"
  trigger: "Uma variável ou parâmetro do tipo complexo recebe um valor inteiro puro"
  message: "A variável esperava um número complexo e recebeu um número inteiro"
  hint: "Adicione a parte imaginária explicitamente (ex: '+ 0i') ou use construtor complexo"
  example_bad: |
    mut as complex128: c = 42
  example_good: |
    mut as complex128: c = 42 + 0i
- code: "TYP412"
  mnemonic: "EXPECT_COMPLEX_GOT_FLOAT"
  severity: "Error"
  trigger: "Uma variável ou parâmetro do tipo complexo recebe um número decimal puro (float)"
  message: "A variável esperava um número complexo e recebeu um número decimal (float)"
  hint: "Adicione a parte imaginária explicitamente (ex: '+ 0.0i')"
  example_bad: |
    mut as complex128: c = 3.14
  example_good: |
    mut as complex128: c = 3.14 + 0.0i
- code: "TYP413"
  mnemonic: "EXPECT_COMPLEX_GOT_STRING"
  severity: "Error"
  trigger: "Uma variável ou parâmetro do tipo complexo recebe uma string"
  message: "A variável esperava um número complexo e recebeu texto (string)"
  hint: "Converta a string para complexo utilizando função de parsing apropriada"
  example_bad: |
    mut as complex128: c = "1+2i"
  example_good: |
    mut as complex128: c = parse_complex("1+2i")
- code: "TYP414"
  mnemonic: "EXPECT_COMPLEX_GOT_BOOL"
  severity: "Error"
  trigger: "Uma variável ou parâmetro do tipo complexo recebe um valor booleano"
  message: "A variável esperava um número complexo e recebeu um booleano (bool)"
  hint: "Booleano não pode ser convertido diretamente para número complexo"
  example_bad: |
    mut as complex128: c = true
  example_good: |
    mut as complex128: c = (true as int64) + 0i

