keyword: fail
category: Status de Retorno
description: Status de falha usado na instrução `emit(fail, ...)`. Indica que a função encontrou um erro ou condição excepcional
  e devolve um struct de resultado com `.sta == "fail"`. O chamador captura o resultado pelos campos `.sta`, `.val` e `.msg`,
  ou despacha o fluxo com o operador `?`. O runtime também gera o status `fail` automaticamente quando ocorre divisão por
  zero (mensagem "divisao por zero").
syntax: emit(fail, <identificador>, "<mensagem>")
pseudocode: "SE erro_detectado:\n    EMITIR_FALHA(valor_parcial, \"motivo\")   // status de falha"
usages:
- name: Emit fail em caminho de erro
  description: Devolve status de erro em um braço de route; o chamador lê .sta, .val e .msg.
  examples:
  - code: "function (validar) (idade: int64) as int64 {\n      route {\n            idade < 18 ==> {\n                  emit(fail,\
      \ idade, \"menor de idade\")\n            }\n            _ ==> {\n                  emit(nice, idade, \"validacao concluida\"\
      )\n            }\n      }\n}\n\nimut as int64: r = validar(15)\nprint(r.sta)     #L \"fail\"\nprint(r.val)     #L 15\n\
      print(r.msg)     #L \"menor de idade\""
- name: Fail gerado automaticamente e propagado com ?
  description: Divisão por zero gera o status fail sem emit explícito; o operador ? despacha para o braço fail.
  examples:
  - code: "function (dividir) (dividendo: int64, divisor: int64) as int64 {\n      mut as int64: resultado = (dividendo /i\
      \ divisor) ? {\n            ==> emit(fail, divisor, \"divisao por zero\")\n            ==> emit(nice, resultado, \"\
      divisao executada\")\n      }\n}"
restrictions:
- '`fail` só pode ser usado como status do primeiro argumento de `emit()` e como braço `==> emit(fail, ...)` do operador `?`
  (o braço fail vem antes do braço nice).'
- O valor de `emit(fail, ...)` deve ser um identificador declarado (sem literais nem expressões).
- A mensagem é obrigatória e deve ser string literal ou interpolada.
- Divisão por zero gera o status `fail` automaticamente, com mensagem 'divisao por zero'.
