keyword: =&, =|, =^, =~, =<<, =>>, =>>>
category: Operador de Atribuição Bitwise
description: Operadores de atribuição composta bitwise. Combinam operação bitwise (AND, OR, XOR, NOT, shifts) com atribuição,
  e suportam apenas identificadores simples.
syntax: '<alvo> =& <expr>             # Atribuição com AND bitwise

  <alvo> =| <expr>             # Atribuição com OR bitwise

  <alvo> =^ <expr>             # Atribuição com XOR bitwise

  <alvo> =~ <expr>             # Atribuição com NOT bitwise

  <alvo> =<< <expr>            # Atribuição com shift left

  <alvo> =>> <expr>            # Atribuição com shift right

  <alvo> =>>> <expr>           # Atribuição com shift right zero-fill'
pseudocode: 'flags := 0b0000

  flags =| 0b0010

  flags =& 0b1110'
usages:
- name: Atribuição composta bitwise
  description: Operação bitwise com atribuição.
  examples:
  - code: 'flags =& 0xFF      # flags = flags & 0xFF

      valor =<< 2        # valor = valor << 2'
restrictions:
- Atribuição composta bitwise suporta apenas identificadores simples.
- Atribuição a imut (constantes) é rejeitada at compile time.
- '=~ (NOT bitwise) não usa o operando da direita: alvo = ~alvo.'
