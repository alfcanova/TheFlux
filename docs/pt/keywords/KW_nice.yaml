keyword: nice
category: Status de Retorno
description: Status de sucesso usado na instrução `emit(nice, ...)`. Indica que a função completou sua execução com sucesso
  e devolve um struct de resultado com `.sta == "nice"`. É a contraparte positiva de `fail`. O chamador captura o resultado
  pelos campos `.sta`, `.val` e `.msg`, ou despacha o fluxo com o operador `?`.
syntax: emit(nice, <identificador>, "<mensagem>")
pseudocode: "FUNCAO valida(x):\n    EMITIR_OK(x, \"sucesso\")   // status de sucesso"
usages:
- name: Emit nice com retorno
  description: Devolve um valor bem-sucedido; o chamador lê .sta, .val e .msg.
  examples:
  - code: "function (calc) (x: int64) as int64 {\n      emit(nice, x, \"ok\")\n}\n\nprogram (Main) {\n      imut as int64:\
      \ r = calc(5)\n      print(r.sta)     #L \"nice\"\n      print(r.val)     #L 5\n      print(r.msg)     #L \"ok\"\n}"
- name: Nice em braço do operador ?
  description: O braço nice do bloco short-circuit é executado quando o subject não é fail.
  examples:
  - code: "function (validar) (idade: int64) as int64 {\n      (idade > 18) ? {\n            ==> emit(fail, idade, \"menor\
      \ de idade\")\n            ==> emit(nice, idade, \"maior de idade\")\n      }\n}"
restrictions:
- '`nice` só pode ser usado como status do primeiro argumento de `emit()` e como braço `==> emit(nice, ...)` do operador `?`
  (o braço nice vem depois do braço fail).'
- O valor de `emit(nice, ...)` deve ser um identificador declarado (sem literais nem expressões).
- A mensagem é obrigatória e deve ser string literal ou interpolada.
